name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Patch unresolvable Compose plugin (runner only)
        run: |
          echo "=== Before patch: build.gradle ==="
          cat build.gradle
          echo "=== Before patch: app/build.gradle ==="
          cat app/build.gradle
          sed -i "/org.jetbrains.kotlin.plugin.compose/d" build.gradle
          sed -i "/org.jetbrains.kotlin.plugin.compose/d" app/build.gradle
          echo "=== After patch: build.gradle ==="
          cat build.gradle
          echo "=== After patch: app/build.gradle ==="
          cat app/build.gradle

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
